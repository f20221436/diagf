  nodes: 'dbservice1 dbservice2 logservice1 logservice2 mobservice1 mobservice2 redisservice1 redisservice2 webservice1 webservice2' 
  heterogeneous: False 
  N_S: 10            
  N_A: 8             # Assuming only '[normal]' was found
  
  # Training Hyperparameters
  seed: 42
  batch_size: 64    
  lr: 0.001
  weight_decay: 0.0001
  epoch: 5         
  win_size: 50       
  win_threshold: 0.0001 
  aug: False         
  aug_size: 0
  save_model: True   

  # Performance Optimizations (Keep these)
  use_mixed_precision: True
  gradient_clip: 1.0
  num_workers: 0     
  pin_memory: True
  prefetch_factor: 4
  persistent_workers: True
  hidden_dim_ratio: 0.6

